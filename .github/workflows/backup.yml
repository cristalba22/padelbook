name: MongoDB encrypted backup

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB_NAME: ${{ vars.MONGODB_DB_NAME }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Create encrypted backup
        run: npm run db:backup -- --output padelbook-backup.pbk
      - name: Verify encrypted backup
        run: npm run db:backup -- --verify-only padelbook-backup.pbk
      - name: Store encrypted artifact
        uses: actions/upload-artifact@v6
        with:
          name: padelbook-mongodb-${{ github.run_id }}
          path: padelbook-backup.pbk
          retention-days: 30
          if-no-files-found: error
      - name: Install browser for isolated QA
        if: github.event_name == 'workflow_dispatch'
        run: npx playwright install --with-deps chromium
      - name: Rehearse restore and multiclub migration
        if: github.event_name == 'workflow_dispatch'
        env:
          MONGODB_URI: ""
          PADELBOOK_BROWSER_SMOKE: "true"
        run: >-
          npm run db:rehearse:from-backup --
          --input padelbook-backup.pbk
          --report multiclub-drill-report.json
          --organization-slug club-piloto
          --organization-name "Club piloto"
          --venue-slug sede-principal
          --venue-name "Sede principal"
      - name: Store migration drill report
        if: github.event_name == 'workflow_dispatch' && success()
        uses: actions/upload-artifact@v6
        with:
          name: padelbook-multiclub-drill-${{ github.run_id }}
          path: multiclub-drill-report.json
          retention-days: 30
          if-no-files-found: error
